# Full Java properties syntax sample.
! Exclamation marks also start comments.
# Keys and values may be separated by =, :, or whitespace.
simple.key=simple value
colon.key: value after colon
space.key value after whitespace
key.with.spaces = value with surrounding spaces
escaped\=equals\:colon=escaped separators in the key
empty.value=
no.value
# Escapes: \\ \t \n \r \f \uXXXX
escapes=tab:\tnewline:\ncarriage:\rformfeed:\fbackslash:\\quote:\'double:\"
unicode=caf\u00E9 \u03B4 \uD83D\uDE00
# A backslash at the end of a line continues the value.
continued=This value \
  continues on the next line
# Leading whitespace in a continuation is ignored; spaces can be escaped.
leading=\ \ \ indented
url=https://example.com/path?query=value#fragment
server.port=8080
server.hosts[0]=localhost
# Brackets are ordinary key characters in .properties files.
[not-a-section]
# Semicolons do not start comments; they are ordinary characters.
semicolon=semi;colon
