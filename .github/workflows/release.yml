# Publishes the plugin to the JetBrains Marketplace.
#
# Triggered by publishing a GitHub release (draft releases are ignored) or
# manually via "Run workflow".
#
# Required repository secret (Settings > Secrets and variables > Actions):
#   PUBLISH_TOKEN – permanent JetBrains Marketplace token
#                   (JETBRAINS_MARKETPLACE_TOKEN is accepted as a fallback name)
#
# Optional signing secrets – when they are not set the Marketplace signs the
# upload itself (the `signPlugin` task is skipped automatically):
#   CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD
#
# The version being published is `pluginVersion` from gradle.properties.
# If that version is already on the Marketplace, the workflow skips publishing
# instead of failing – bump `pluginVersion` to release again.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # Required to attach the built plugin archive to the GitHub release.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -E '^pluginVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Require Marketplace token
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN || secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::No Marketplace token found. Add a PUBLISH_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # A version cannot be uploaded twice, and the public API does not list
      # pending/rejected uploads – an upload that is already pending will still
      # fail loudly in the "Publish plugin" step below.
      - name: Check whether this version is already published
        id: published
        run: |
          PLUGIN_ID=$(curl -fsS "https://plugins.jetbrains.com/api/searchPlugins?search=com.vlnabatov.alabaster&max=20" \
            | jq -r '.plugins[] | select(.xmlId == "com.vlnabatov.alabaster") | .id')
          if [ -z "$PLUGIN_ID" ]; then
            echo "::error::Could not resolve the plugin id on the JetBrains Marketplace."
            exit 1
          fi
          if curl -fsS "https://plugins.jetbrains.com/api/plugins/${PLUGIN_ID}/updates?size=100" \
            | jq -e --arg v "${{ steps.version.outputs.version }}" '.[] | select(.version == $v)' > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin
        if: steps.published.outputs.exists == 'false'
        run: ./gradlew --no-daemon buildPlugin

      - name: Verify plugin
        if: steps.published.outputs.exists == 'false'
        run: ./gradlew --no-daemon verifyPlugin

      - name: Publish plugin
        if: steps.published.outputs.exists == 'false'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN || secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon publishPlugin

      - name: Report skipped publish
        if: steps.published.outputs.exists == 'true'
        run: echo "::notice::Alabaster Themes ${{ steps.version.outputs.version }} is already on the JetBrains Marketplace; bump pluginVersion to release a new version."

      - name: Upload plugin archive to the release
        if: github.event_name == 'release' && steps.published.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./build/distributions/*.zip --clobber
