# Builds the plugin for every push to main and every pull request.
#
# Publishing to the JetBrains Marketplace is handled by release.yml and is
# triggered by publishing a GitHub release (or manually via workflow_dispatch).
#
# GitHub Actions reference: https://docs.github.com/en/actions

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The build uses a Java 25 toolchain (IntelliJ Platform 2026.3 classes are Java 25
      # bytecode) and produces Java 17-compatible bytecode for the IDE runtime.
      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin

      - name: Read plugin version
        id: version
        run: echo "version=$(grep -E '^pluginVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: Alabaster-${{ steps.version.outputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error

  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The Plugin Verifier downloads the IDE distributions it checks the plugin
      # against; caching them keeps this job fast on repeated runs.
      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@v4
        with:
          path: |
            ~/.pluginVerifier/ides
            ~/.pluginVerifier/loaded-plugins
          key: plugin-verifier-${{ hashFiles('gradle.properties', 'build.gradle.kts') }}

      - name: Run Plugin Verifier
        run: ./gradlew --no-daemon verifyPlugin

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginVerifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
